<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${accion} + ' Tarea - Gestión de Tareas'">Formulario de Tarea</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --dark: #0f172a;
            --slate-700: #334155;
            --slate-500: #64748b;
            --slate-300: #cbd5e1;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;
            --white: #ffffff;
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-md: 10px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
            color: var(--dark);
            min-height: 100vh;
            padding: 2.5rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
            max-width: 650px;
            width: 100%;
            border: 1px solid var(--slate-200);
        }

        .form-header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--slate-200);
            padding-bottom: 1.25rem;
        }

        .form-header h1 {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-header p {
            color: var(--slate-500);
            font-size: 0.9rem;
            margin-top: 0.35rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--slate-700);
            margin-bottom: 0.5rem;
        }

        .form-label .required {
            color: var(--danger);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--slate-300);
            background-color: var(--slate-50);
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--dark);
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background-color: var(--white);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .form-control.is-invalid {
            border-color: var(--danger);
            background-color: var(--danger-light);
        }

        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }

        .error-message {
            display: block;
            color: var(--danger);
            font-size: 0.825rem;
            font-weight: 500;
            margin-top: 0.4rem;
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .form-check-input {
            width: 1.2rem;
            height: 1.2rem;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .form-check-label {
            font-size: 0.925rem;
            font-weight: 500;
            color: var(--slate-700);
            cursor: pointer;
        }

        .form-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--slate-200);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white);
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.35);
        }

        .btn-secondary {
            background-color: var(--slate-100);
            color: var(--slate-700);
            border: 1px solid var(--slate-200);
        }

        .btn-secondary:hover {
            background-color: var(--slate-200);
        }
    </style>
</head>
<body>
<div class="form-card">
    <div class="form-header">
        <h1>
            <span th:text="${accion == 'Editar' ? '✏️' : '➕'}"></span>
            <span th:text="${accion} + ' Tarea'">Crear Tarea</span>
        </h1>
        <p>Complete los datos del formulario respetando las restricciones de validación.</p>
    </div>

    <form th:action="@{/tareas/guardar}" th:object="${tarea}" method="post">
        <!-- Input hidden para ID -->
        <input type="hidden" th:field="*{id}" />

        <!-- Título -->
        <div class="form-group">
            <label for="titulo" class="form-label">
                Título <span class="required">*</span>
            </label>
            <input type="text" id="titulo" th:field="*{titulo}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid' : ''"
                   placeholder="Ej: Preparar informe de arquitectura" />
            <span class="error-message" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}">
                Error de título
            </span>
        </div>

        <!-- Descripción -->
        <div class="form-group">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea id="descripcion" th:field="*{descripcion}"
                      class="form-control"
                      th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid' : ''"
                      placeholder="Detalles u objetivos de la tarea (máx. 500 caracteres)..."></textarea>
            <span class="error-message" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}">
                Error de descripción
            </span>
        </div>

        <!-- Prioridad -->
        <div class="form-group">
            <label for="prioridad" class="form-label">
                Prioridad <span class="required">*</span>
            </label>
            <select id="prioridad" th:field="*{prioridad}"
                    class="form-control"
                    th:classappend="${#fields.hasErrors('prioridad')} ? 'is-invalid' : ''">
                <option value="" disabled th:selected="${tarea.prioridad == null}">-- Seleccione una prioridad --</option>
                <option th:each="p : ${prioridades}"
                        th:value="${p}"
                        th:text="${p.etiqueta}">
                </option>
            </select>
            <span class="error-message" th:if="${#fields.hasErrors('prioridad')}" th:errors="*{prioridad}">
                Error de prioridad
            </span>
        </div>

        <!-- Fecha Límite -->
        <div class="form-group">
            <label for="fechaLimite" class="form-label">
                Fecha Límite <span class="required">*</span>
            </label>
            <input type="date" id="fechaLimite" th:field="*{fechaLimite}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('fechaLimite')} ? 'is-invalid' : ''" />
            <span class="error-message" th:if="${#fields.hasErrors('fechaLimite')}" th:errors="*{fechaLimite}">
                Error de fecha límite
            </span>
        </div>

        <!-- Completada -->
        <div class="form-group">
            <label class="form-check">
                <input type="checkbox" id="completada" th:field="*{completada}" class="form-check-input" />
                <span class="form-check-label">Marcar como tarea completada</span>
            </label>
        </div>

        <!-- Botones de Acción -->
        <div class="form-actions">
            <a th:href="@{/tareas}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary" id="btn-guardar">💾 Guardar Tarea</button>
        </div>
    </form>
</div>
</body>
</html>
